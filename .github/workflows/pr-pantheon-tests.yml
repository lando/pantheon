name: Pantheon Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      lando-version:
        description: 'Lando version'
        required: true
        default: '3-edge'
        type: string

jobs:
  leia-tests:
    runs-on: ${{ matrix.os }}
    # Queue each fixture's stable/edge pair as one unit; newer pending runs may replace older pairs.
    concurrency:
      group: pantheon-fixture-${{ matrix.leia-test }}
      cancel-in-progress: false
    env:
      TERM: xterm
      PANTHEON_MACHINE_TOKEN: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        leia-test:
          - examples/drupal7
          - examples/drupal9
          - examples/drupal10
          - examples/drupal11
          - examples/init
          - examples/pantheon-downstreamer-1
          - examples/pantheon-downstreamer-2
          - examples/pantheon-drush-uri
          - examples/pantheon-php-warning
          - examples/frontend-build
          - examples/wordpress
          - examples/wordpressnetworkdomain
          # - examples/wordpressnetworkfolder
        os:
          - ubuntu-24.04
        node-version:
          - '20'

    steps:
      # Install deps and cache
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install NPM dependencies
        run: npm clean-install --production --prefer-offline --frozen-lockfile
      - name: Bundle Deps
        uses: lando/prepare-release-action@v3
        with:
          lando-plugin: true
          version: dev
          sync: false
      - name: Stagger Pantheon API requests
        shell: bash
        env:
          FIXTURE: ${{ matrix.leia-test }}
        run: |
          HASH=$(echo -n "$FIXTURE" | cksum | cut -d' ' -f1)
          sleep "$(( HASH % 120 ))"
      # Each Leia invocation includes its own setup and Destroy tests sections.
      - name: Setup Lando 3-stable
        id: setup-stable
        continue-on-error: true
        uses: lando/setup-lando@v3
        with:
          lando-version: 3-stable
          lando-version-file: ''
          config: |
            setup.skipCommonPlugins=true
            setup.plugins.@lando/pantheon=/home/runner/work/pantheon/pantheon
          telemetry: false
      - name: Run Leia Tests (3-stable)
        id: tests-stable
        if: steps.setup-stable.outcome == 'success'
        continue-on-error: true
        uses: lando/run-leia-action@v2
        with:
          leia-test: "./${{ matrix.leia-test }}/README.md"
          cleanup-header: "Destroy tests"
          retry: 3
          shell: bash
          stdin: true
          # npm ci --production skips the local dev Leia; pin the global fallback to the lockfile version (latest needs Node >=24).
          version: '1.0.0-beta.4'
      - name: Setup Lando 3-edge
        id: setup-edge
        continue-on-error: true
        uses: lando/setup-lando@v3
        with:
          lando-version: 3-edge
          lando-version-file: ''
          config: |
            setup.skipCommonPlugins=true
            setup.plugins.@lando/pantheon=/home/runner/work/pantheon/pantheon
          telemetry: false
      - name: Run Leia Tests (3-edge)
        id: tests-edge
        if: steps.setup-edge.outcome == 'success'
        continue-on-error: true
        uses: lando/run-leia-action@v2
        with:
          leia-test: "./${{ matrix.leia-test }}/README.md"
          cleanup-header: "Destroy tests"
          retry: 3
          shell: bash
          stdin: true
          # npm ci --production skips the local dev Leia; pin the global fallback to the lockfile version (latest needs Node >=24).
          version: '1.0.0-beta.4'
      - name: Require both Lando variants
        if: ${{ !cancelled() }}
        env:
          STABLE: ${{ steps.tests-stable.outcome }}
          EDGE: ${{ steps.tests-edge.outcome }}
        run: test "$STABLE" = success && test "$EDGE" = success
